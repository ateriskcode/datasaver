  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;color:#eee;font-family:system-ui,-apple-system,sans-serif;padding:2rem;min-height:100vh;display:flex;flex-direction:column;align-items:center}
  h1{font-size:1.5rem;font-weight:400;letter-spacing:.05em;text-transform:lowercase;margin-bottom:1.5rem}

  .tabs{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.5rem;max-width:760px}
  .tab{padding:.5rem 1rem;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:5px;cursor:pointer;font-size:.85rem;color:#aaa;transition:background .12s,border-color .12s,color .12s}
  .tab:hover{background:#262626;color:#fff}
  .tab.active{background:#2a3d52;border-color:#3d7fc4;color:#fff}

  .grid{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem}
  .item{padding:.75rem 1rem;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:5px;cursor:pointer;font-size:.85rem;color:#fff;font-weight:500;transition:background .12s,border-color .12s;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item:hover{background:#262626;border-color:#3d7fc4}
  .empty{padding:2rem;text-align:center;color:#666;font-size:.85rem;grid-column:1/-1}

  #search{width:100%;max-width:760px;margin-bottom:1rem;padding:.6rem 1rem;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:5px;color:#fff;font-size:.9rem;outline:none}
  #search:focus{border-color:#3d7fc4}
</style>

var tabsEl  = document.getElementById('tabs');
var gridEl  = document.getElementById('grid');
var searchEl = document.getElementById('search');
var activeCat = 'release';
var query = '';

function renderTabs() {
  tabsEl.innerHTML = '';
  Object.keys(CATEGORIES).forEach(function (key) {
    var t = document.createElement('div');
    t.className = 'tab' + (key === activeCat ? ' active' : '');
    t.textContent = CATEGORIES[key].label;
    t.onclick = function () { activeCat = key; renderTabs(); renderGrid(); };
    tabsEl.appendChild(t);
  });
}

function renderGrid() {
  var versions = CATEGORIES[activeCat].versions;
  if (query) {
    versions = versions.filter(function (v) {
      return v.name.toLowerCase().indexOf(query) !== -1;
    });
  }

  gridEl.innerHTML = '';
  if (!versions.length) {
    gridEl.innerHTML = '<div class="empty">no results</div>';
    return;
  }

  versions.forEach(function (v) {
    var el = document.createElement('div');
    el.className = 'item';
    el.textContent = v.name;
    el.title = v.name;
    el.onclick = function () { openGame(v); };
    gridEl.appendChild(el);
  });
}

searchEl.addEventListener('input', function (e) {
  query = e.target.value.toLowerCase();
  renderGrid();
});

function openGame(v) {
  document.open();
  document.write(
    '<!doctype html><html><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + v.name + '</title>' +
    '<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#000;color:#fff;' +
    'font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;' +
    'font-size:1.1rem}</style></head><body>Loading ' + v.name + '...</body></html>'
  );
  document.close();

  fetch(v.url)
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (html) {
      var dir = v.url.substring(0, v.url.lastIndexOf('/') + 1);
      html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + dir + '">');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (err) {
      document.open();
      document.write(
        '<!doctype html><html><head><meta charset="utf-8"><title>Error</title>' +
        '<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#000;color:#f44;' +
        'font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;' +
        'font-size:1.1rem;padding:2rem;text-align:center}</style></head>' +
        '<body>Failed to load ' + v.name + ': ' + err.message + '</body></html>'
      );
      document.close();
    });
}

renderTabs();
renderGrid();
